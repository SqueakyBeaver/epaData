<table id="data-table"
       class="table table-striped table-bordered nowrap"
       data-page-length="25">
    <thead>
        {% for column in data.columns %}
            <th scope="col">{{ column }}</th>
        {% endfor %}
    </thead>
    <tbody>
        {% for row in data.itertuples(index=False) %}
            <tr>
                {% for item in row %}
                    <td>{{ item }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    var table = new DataTable('#data-table', {
        scroller: true,
        scrollY: 400,
        scrollX: true,
    });
</script>
